<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Label Verify Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Familjen+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: packing-desk console — dark "dispatch" band with the AI checker avatar on top; left rail (files + filters), right work area. Cards echo 4x6 thermal labels. */
:root{
  --bg:#eef0ec; --paper:#ffffff; --paper2:#f7f8f5; --ink:#14171a; --muted:#5b6168; --line:#dcdfd8; --soft:#e9ece6;
  --accent:#e2780f; --accent-ink:#ffffff; --accent-soft:#fcebd8;
  --ok:#16824f; --ok-soft:#dcf2e5; --warn:#a35f00; --warn-soft:#fbefd4; --bad:#c62830; --bad-soft:#fbe0e1;
  --hero:#15191d; --hero2:#1f252b; --hero-ink:#f1f3ef; --hero-muted:#a3abb3; --hero-line:#2f363d;
  --bot-body:#f1f3ef; --bot-visor:#1b2a33; --bot-eye:#5fe3ff;
  --b-ss:#c2410c; --b-lwm:#2563a8; --b-td:#7a3e9d; --b-ds:#0f7c6b; --b-x:#6b7280;
  --c-ekart:#2f5bd3; --c-bluedart:#1d3f8f; --c-delhivery:#d23a2f; --c-xb:#e0a100; --c-amz:#1f2a36; --c-dtdc:#c1272d; --c-sf:#0e8a5f; --c-ecom:#7a2fb5; --c-ip:#b5442a; --c-x:#6b7280;
  --shadow:0 1px 0 rgba(20,23,26,.04),0 6px 18px -10px rgba(20,23,26,.25);
  --f-ui:"Familjen Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Bricolage Grotesque","Familjen Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1214; --paper:#181c1f; --paper2:#1d2125; --ink:#eceee9; --muted:#9aa1a8; --line:#2b3035; --soft:#22272b;
  --accent:#f39339; --accent-ink:#1b1206; --accent-soft:#3a2614;
  --ok:#4cc38a; --ok-soft:#163525; --warn:#f0b54a; --warn-soft:#382a0f; --bad:#f2707a; --bad-soft:#3b191c;
  --hero:#090b0d; --hero2:#14181b; --hero-ink:#f1f3ef; --hero-muted:#9aa2aa; --hero-line:#262c31;
  --b-ss:#f08a4b; --b-lwm:#6ea8ef; --b-td:#c18de0; --b-ds:#4fc9b4; --b-x:#9ca3af;
  --c-ekart:#5b82f0; --c-bluedart:#4f74d1; --c-delhivery:#ef6056; --c-xb:#e8b21f; --c-amz:#4b5a6b; --c-dtdc:#e0525a; --c-sf:#35b685; --c-ecom:#a565de; --c-ip:#d8694e; --c-x:#8b939c;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1214; --paper:#181c1f; --paper2:#1d2125; --ink:#eceee9; --muted:#9aa1a8; --line:#2b3035; --soft:#22272b;
  --accent:#f39339; --accent-ink:#1b1206; --accent-soft:#3a2614;
  --ok:#4cc38a; --ok-soft:#163525; --warn:#f0b54a; --warn-soft:#382a0f; --bad:#f2707a; --bad-soft:#3b191c;
  --hero:#090b0d; --hero2:#14181b; --hero-ink:#f1f3ef; --hero-muted:#9aa2aa; --hero-line:#262c31;
  --b-ss:#f08a4b; --b-lwm:#6ea8ef; --b-td:#c18de0; --b-ds:#4fc9b4; --b-x:#9ca3af;
  --c-ekart:#5b82f0; --c-bluedart:#4f74d1; --c-delhivery:#ef6056; --c-xb:#e8b21f; --c-amz:#4b5a6b; --c-dtdc:#e0525a; --c-sf:#35b685; --c-ecom:#a565de; --c-ip:#d8694e; --c-x:#8b939c;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1380px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px}

/* ---------- hero / AI avatar ---------- */
.hero{background:radial-gradient(120% 140% at 0% 0%,var(--hero2),var(--hero) 60%);color:var(--hero-ink);border-radius:18px;padding:18px 20px;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(260px,340px);gap:20px;align-items:center;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:260px;height:160px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 5px,rgba(255,255,255,.05) 5px 6px,transparent 6px 10px);transform:rotate(-8deg);pointer-events:none}
@media (max-width:980px){.hero{grid-template-columns:auto minmax(0,1fr)}.hero .dropz{grid-column:1/-1}}
@media (max-width:520px){.hero{grid-template-columns:minmax(0,1fr)}.botwrap{justify-self:start}}
.botwrap{width:96px;height:96px;border-radius:24px;background:linear-gradient(160deg,#2a333b,#151a1e);display:grid;place-items:center;position:relative;box-shadow:inset 0 0 0 1px var(--hero-line)}
.botwrap.busy{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 6px rgba(226,120,15,.18)}
.botwrap.ok{box-shadow:inset 0 0 0 1px var(--ok),0 0 0 6px rgba(22,130,79,.2)}
.botwrap.alert{box-shadow:inset 0 0 0 1px var(--bad),0 0 0 6px rgba(198,40,48,.22)}
.bot{width:76px;height:76px;display:block;overflow:visible}
.bot .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.bot .beam{opacity:0}
.busy .bot .beam{opacity:1;animation:beam 1.1s ease-in-out infinite alternate}
.busy .bot .eye{animation:look 1.1s ease-in-out infinite alternate}
.bot .ant{animation:pulse 2s ease-in-out infinite}
.busy .bot .ant{animation-duration:.5s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes beam{from{transform:translateY(0)}to{transform:translateY(17px)}}
@keyframes look{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero-text{min-width:0;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.hero .who{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-muted);font-weight:600;display:flex;gap:8px;align-items:center}
.hero .who .live{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.hero h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(22px,2.6vw,30px);line-height:1.08;margin:0;letter-spacing:-.02em;text-wrap:balance}
.hero .say{color:var(--hero-muted);font-size:14px;max-width:62ch}
.hero .say b{color:var(--hero-ink)}
.insights{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ins{font-size:12px;border:1px solid var(--hero-line);background:rgba(255,255,255,.04);border-radius:999px;padding:4px 10px;color:var(--hero-ink)}
.ins.bad{border-color:rgba(242,112,122,.5);color:#ffb3b8}
.ins.ok{border-color:rgba(76,195,138,.5);color:#9fe6c2}
.prog{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px;max-width:420px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.dropz{border:1.5px dashed #3d464e;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:rgba(255,255,255,.03);position:relative;z-index:1;transition:border-color .15s,background .15s}
.dropz.over{border-color:var(--accent);background:rgba(226,120,15,.12)}
.dropz b{font-size:15px}
.dropz small{color:var(--hero-muted)}
.dropz .row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:transform .08s,border-color .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:var(--hero-line);color:var(--hero-ink)}
.btn.ghost:hover{border-color:var(--hero-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}

.grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
@media (max-width:960px){.rail{position:static}}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:0 8px;align-items:center;font-size:12.5px;padding:7px 8px;border-radius:9px;background:var(--paper2);border:1px solid var(--line)}
.file .ic{grid-row:1/3;width:22px;height:26px;border-radius:3px;background:var(--soft);border:1px solid var(--line);position:relative}
.file .ic::after{content:"PDF";position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:6.5px;font-weight:700;color:var(--bad)}
.file .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.file .c{color:var(--muted);grid-column:2;grid-row:2;font-size:11.5px}
.file .x{grid-column:3;grid-row:1/3}
.x{border:0;background:none;color:var(--muted);padding:2px 6px;border-radius:6px}
.x:hover{background:var(--soft);color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px 4px 5px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.chip.plain{padding-left:10px}
.chip .k{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .k{color:inherit;opacity:.7}
.bsw{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.fgroup{display:flex;flex-direction:column;gap:7px}
.fgroup+.fgroup{margin-top:14px}
.flabel{font-size:12px;color:var(--muted);font-weight:600}
.search{width:100%;border:1px solid var(--line);background:var(--paper2);border-radius:9px;padding:9px 11px}

/* courier badge (generic monogram, not a brand logo) */
.cb{--c:var(--c-x);display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;background:var(--c);color:#fff;font:700 9.5px/1 var(--f-mono);letter-spacing:.02em;flex:none}
.cb.lg{min-width:34px;height:34px;border-radius:9px;font-size:12px}
.cpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 3px}
.cpill .k{font-family:var(--f-mono);color:var(--muted);font-weight:600}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:1150px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:3px;text-align:left;box-shadow:var(--shadow);position:relative;overflow:hidden}
button.stat:hover{border-color:var(--ink)}
.stat .v{font-family:var(--f-disp);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:600}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.stat.ok::before{background:var(--ok)} .stat.bad::before{background:var(--bad)} .stat.warn::before{background:var(--warn)} .stat.acc::before{background:var(--accent)}
.stat.bad .v{color:var(--bad)}
.splitbar{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px}

.tabs{display:flex;gap:2px;margin-bottom:14px;overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.tab{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);border-radius:9px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--bg);background:var(--ink)}
.tab .cnt{font-family:var(--f-mono);font-size:11px;background:var(--soft);color:var(--ink);border-radius:999px;padding:1px 7px}
.tab .cnt.bad{background:var(--bad);color:#fff}

/* download center */
.dlc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;box-shadow:var(--shadow)}
.dlc .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dlc .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--paper2)}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.toolbar .btn,.dlc .btn{white-space:normal;text-align:left}

/* product cards */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
.gcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s,transform .15s}
.gcard:hover{border-color:var(--ink)}
.gcard.has-bad{border-color:var(--bad)}
.gtop{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding:14px}
.stack{position:relative;width:104px;height:134px}
.stack .thumb{position:absolute;top:0;left:8px;width:84px;height:126px}
.stack .thumb:nth-child(2){transform:rotate(-6deg) translate(-8px,4px);opacity:.85}
.stack .thumb:nth-child(3){transform:rotate(6deg) translate(10px,4px);opacity:.85}
.stack .thumb:first-child{z-index:2}
.thumb{background:#fff;border-radius:4px;overflow:hidden;border:1px solid var(--line);box-shadow:0 4px 10px -6px rgba(0,0,0,.4)}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;color:#7a8087;text-align:center;padding:6px;background:repeating-linear-gradient(0deg,#fff 0 6px,#f1f2ef 6px 7px)}
.stack .count{position:absolute;right:0;bottom:0;z-index:3;background:var(--ink);color:var(--bg);font-family:var(--f-disp);font-weight:800;font-size:15px;border-radius:999px;min-width:32px;height:32px;padding:0 8px;display:grid;place-items:center;border:3px solid var(--paper)}
.gbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.brand{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.gtitle{font-family:var(--f-disp);font-weight:800;font-size:18px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.skuline{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);word-break:break-all}
.gmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{white-space:nowrap;font-size:11.5px;border-radius:999px;padding:2px 9px;background:var(--soft);display:inline-flex;gap:4px;align-items:center;font-weight:600}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.gfoot{border-top:1px dashed var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--paper2)}
.gfoot .sp{flex:1}
.combo{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600}
.combo div{display:flex;gap:8px;align-items:baseline}
.combo .q{font-family:var(--f-mono);font-weight:700;color:var(--accent);min-width:26px}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--paper2)}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-family:var(--f-mono)}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--paper2)}
tr.badrow td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.flag{display:block;font-size:12px;margin-top:3px}
.flag.bad{color:var(--bad)} .flag.warn{color:var(--warn)}
td input,td select{width:100%;border:1px solid var(--line);background:var(--paper2);border-radius:7px;padding:5px 7px;font-size:12.5px}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap}

/* review hero */
.alertbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px;border-radius:var(--r);background:var(--bad-soft);border:1px solid var(--bad);margin-bottom:12px}
.alertbox.okbox{background:var(--ok-soft);border-color:var(--ok)}
.alertbox .t{flex:1;min-width:220px}
.alertbox b{display:block;font-size:15px}

/* empty */
.empty{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;box-shadow:var(--shadow)}
@media (max-width:760px){.empty{grid-template-columns:minmax(0,1fr)}}
.empty h2{margin:0 0 8px;font-family:var(--f-disp);font-weight:800;font-size:24px;letter-spacing:-.02em;text-wrap:balance}
.empty p{color:var(--muted);margin:0 0 14px;max-width:60ch}
.flow{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none;counter-reset:s}
.flow li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;counter-increment:s}
.flow li::before{content:counter(s);width:26px;height:26px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700}
.flow b{display:block}
.flow span{color:var(--muted);font-size:13px}
.formats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

<script>
/* ===== LABEL PARSER (shared by page + node tests) ===== */
function buildLines(items){
  const its=items.filter(i=>i.s.trim()).slice().sort((a,b)=>a.y-b.y||a.x-b.x);
  const lines=[];
  for(const it of its){
    let L=lines.find(l=>Math.abs(l.y-it.y)<2.2);
    if(!L){L={y:it.y,items:[]};lines.push(L)}
    L.items.push(it);
  }
  lines.sort((a,b)=>a.y-b.y);
  return lines.map(l=>{l.items.sort((a,b)=>a.x-b.x);
    let t='',end=null;
    for(const it of l.items){ if(end!==null){t+=(it.x-end>1.5?' ':'')} t+=it.s; end=it.x+(it.w||it.s.length*4);}
    return {y:l.y,text:t.replace(/\s+/g,' ').trim(),items:l.items}});
}
const COURIERS=[['ekart','Ekart'],['e-kart','Ekart'],['bluedart','BlueDart'],['blue dart','BlueDart'],['delhivery','Delhivery'],['xpressbees','Xpressbees'],['dtdc','DTDC'],['shadowfax','Shadowfax'],['ecom express','Ecom Express'],['amazon shipping','Amazon Shipping'],['india post','India Post'],['speed post','India Post'],['ekart logistics','Ekart']];
function findCourier(s){s=s.toLowerCase();for(const[k,v]of COURIERS){if(s.includes(k))return v}return ''}

function parseRapid(items,lines,all){
  const r={format:'rapid',platform:/shiprocket/i.test(all)?'Shiprocket':'RapidShyp'};
  r.awb=(all.match(/AWB\s*:\s*([A-Z0-9]+)/)||[])[1]||'';
  r.orderId=(all.match(/Order ID#\s*:\s*(\S+)/)||[])[1]||'';
  r.payment=/\bCOD\b/.test(all)?'COD':(/PREPAID/i.test(all)?'Prepaid':'');
  const cv=all.match(/Collectable Value:\s*₹\s*([\d,.]+)/);r.cod=cv?+cv[1].replace(/,/g,''):0;
  // courier: big text between phone and AWB
  const awbIt=items.find(i=>/^AWB\s*:/.test(i.s));
  let cand=items.filter(i=>awbIt&&i.y<awbIt.y&&i.y>60&&i.x>100&&!/AWB|Routing|₹|Collectable/.test(i.s));
  r.courier=findCourier(cand.map(i=>i.s).join(' '))||(cand[0]?cand[0].s.trim():'')||findCourier(all);
  const sb=lines.findIndex(l=>/^Shipped By/.test(l.text));
  r.shippedBy=sb>=0&&lines[sb+1]?lines[sb+1].items.filter(i=>i.x<140).map(i=>i.s).join(' ').trim():'';
  // table
  const hName=items.find(i=>i.s.trim()==='Item Name'),hSku=items.find(i=>i.s.trim()==='SKU Code'),hQty=items.find(i=>i.s.trim()==='Qty'),hAmt=items.find(i=>/^Amount/.test(i.s.trim()));
  const tot=items.find(i=>i.s.trim()==='Total'&&hName&&i.y>hName.y);
  r.items=[];
  if(hName&&hSku&&hQty){
    const top=hName.y+2,bot=tot?tot.y-2:hName.y+200;
    const inT=items.filter(i=>i.y>top&&i.y<bot&&i.s.trim());
    const qtys=inT.filter(i=>Math.abs(i.x-hQty.x)<10&&/^\d+$/.test(i.s.trim()));
    for(const q of qtys){
      const sku=inT.filter(i=>i.x>=hSku.x-6&&i.x<hQty.x-4&&Math.abs(i.y-q.y)<3).map(i=>i.s).join('').trim();
      const amt=hAmt?inT.filter(i=>i.x>=hAmt.x-6&&Math.abs(i.y-q.y)<3).map(i=>i.s).join('').trim():'';
      r.items.push({sku,qty:+q.s.trim(),amount:+(amt.replace(/[₹,\s]/g,'')||0),name:'',_y:q.y});
    }
    const names=inT.filter(i=>i.x<hSku.x-6);
    for(const n of names){let best=null,bd=1e9;for(const it of r.items){const d=Math.abs(it._y-n.y);if(d<bd){bd=d;best=it}}
      if(best)(best._n=best._n||[]).push(n)}
    for(const it of r.items){it.name=(it._n||[]).sort((a,b)=>a.y-b.y).map(n=>n.s.trim()).reduce((acc,p)=>!acc?p:(/[a-z]$/.test(acc)&&/^[a-z]/.test(p)?acc+p:acc+' '+p),'').replace(/\s+/g,' ').trim();delete it._n;delete it._y}
  }
  return r;
}

function parseFlipkart(items,lines,all){
  const r={format:'flipkart',platform:'Flipkart'};
  r.awb=(all.match(/AWB No\.?[ \t]*([A-Z0-9]{8,})/)||[])[1]||((lines.find(l=>/^[A-Z]{2,6}\d{8,}$/.test(l.text)&&!/^OD\d/.test(l.text))||{}).text)||'';
  r.orderId=(all.match(/\b(OD\d{12,})\b/)||[])[1]||'';
  r.payment=/\bCOD\b/.test(all)?'COD':(/PREPAID/.test(all)?'Prepaid':'');
  r.courier=findCourier(all.split('Ordered through')[0])||'Ekart';
  r.shippedBy='';r.items=[];
  const hi=lines.findIndex(l=>/SKU ID\s*\|\s*Description/.test(l.text));
  if(hi>=0){
    const hdr=lines[hi];const qtyIt=hdr.items.find(i=>/QTY/.test(i.s));const qx=qtyIt?qtyIt.x:1e9;
    let cur=null;
    for(let k=hi+1;k<lines.length;k++){
      const L=lines[k];if(L.y-hdr.y>140)break;
      if(/^[A-Z]{2,5}[A-Z0-9]{6,}$/.test(L.text)||/Not for resale|Printed at/.test(L.text))break;
      const left=L.items.filter(i=>i.x<qx-15).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim();
      const q=L.items.filter(i=>i.x>=qx-15).map(i=>i.s).join('').trim();
      const m=left.match(/^(\d+)\s+(\S+)\s*\|\s*(.*)$/);
      if(m){cur={sku:m[2],name:m[3],qty:+(q||1),amount:0};r.items.push(cur)}
      else if(cur&&left&&!/^[A-Z0-9]{2,4}$/.test(left)){ if(cur.name.length<120) cur.name+=' '+left }
      else if(!left&&!q&&cur){/*blank*/}
    }
  }
  return r;
}

function parseAmazonInvoice(items,lines,all){
  const r={format:'amazon',platform:'Amazon',courier:'Amazon Shipping',shippedBy:'',awb:'',payment:'',items:[]};
  r.orderId=(all.match(/Order Number:\s*([\d-]+)/)||[])[1]||'';
  const hdr=items.find(i=>/^Description/.test(i.s.trim()));
  const unit=items.find(i=>/^Unit/.test(i.s.trim()));
  const totL=lines.find(l=>/^TOTAL:/.test(l.text));
  if(!hdr)return r;
  const cut=unit?unit.x-8:hdr.x+300;
  const bot=totL?totL.y:1e9;
  const sl=items.filter(i=>i.x<hdr.x-2&&/^\d{1,2}$/.test(i.s.trim())&&i.y>hdr.y+6&&i.y<bot).sort((a,b)=>a.y-b.y);
  const rowsTxt=sl.map(()=>({t:''}));
  const desc=items.filter(i=>i.x>=hdr.x-2&&i.x<cut&&i.y>hdr.y+6&&i.y<bot&&i.s.trim()).sort((a,b)=>a.y-b.y||a.x-b.x);
  for(const d of desc){let k=-1;for(let j=0;j<sl.length;j++){if(sl[j].y<=d.y+4)k=j}
    if(k<0&&sl.length)k=0; if(k>=0)rowsTxt[k].t+=' '+d.s}
  rowsTxt.forEach(r=>r.t=r.t.replace(/\s+/g,' ').trim());
  const priceRows=lines.filter(l=>/₹[\d,.]+\s+\d+\s+₹[\d,.]+/.test(l.text));
  rowsTxt.forEach((row,i)=>{
    const m=row.t.match(/([A-Z0-9]{10})\s*\(\s*([^)]+?)\s*\)/);
    let qty=1,amt=0;const pr=priceRows[i];
    if(pr){const mm=pr.text.match(/₹([\d,.]+)\s+(\d+)\s+₹([\d,.]+)/);qty=+mm[2];const t=pr.text.match(/₹([\d,.]+)\s*$/);amt=t?+t[1].replace(/,/g,''):0}
    const name=(m?row.t.slice(0,row.t.indexOf(m[1])):row.t).replace(/HSN:?\s*\d+/,'').replace(/[|\s]+$/,'').trim();
    r.items.push({sku:m?m[2].replace(/\s+/g,''):'',asin:m?m[1]:'',qty,amount:amt,name:name.slice(0,110)});
  });
  return r;
}

function classifyPage(items){
  const lines=buildLines(items);const all=lines.map(l=>l.text).join('\n');
  if(!items.some(i=>i.s.trim()))return {kind:'image'};
  if(/Deliver To:/.test(all)&&/Item Name/.test(all)&&/SKU Code/.test(all))return {kind:'label',data:parseRapid(items,lines,all)};
  if(/SKU ID\s*\|\s*Description/.test(all)&&/AWB No/.test(all))return {kind:'label',data:parseFlipkart(items,lines,all)};
  if(/Tax Invoice\/Bill of Supply/.test(all)&&/Order Number:/.test(all))return {kind:'amzinvoice',data:parseAmazonInvoice(items,lines,all)};
  if(/Tax Invoice/.test(all)&&/Order Id:/.test(all))return {kind:'invoice'};
  return {kind:'unknown',text:all.slice(0,400)};
}
/* Turn a file's pages into shipments. pages[i] = {items} ; returns [{pages:[i..], data|null, needsAI}] */
function groupPages(pages){
  const cls=pages.map(p=>classifyPage(p.items));const out=[];
  for(let i=0;i<cls.length;i++){
    const c=cls[i];
    if(c.kind==='image'){
      if(cls[i+1]&&cls[i+1].kind==='amzinvoice'){out.push({pages:[i],extra:[i+1],data:cls[i+1].data});i++;continue}
      out.push({pages:[i],data:null,needsAI:true});continue;
    }
    if(c.kind==='label'){out.push({pages:[i],data:c.data});continue}
    if(c.kind==='amzinvoice'){out.push({pages:[i],data:c.data});continue}
    if(c.kind==='invoice'){ if(out.length)(out[out.length-1].extra=out[out.length-1].extra||[]).push(i); continue}
    out.push({pages:[i],data:null,needsAI:true,unknown:true});
  }
  return out;
}

/* ---------- matching ---------- */
const STOP=new Set(['for','the','and','of','a','an','with','to','in','by','set','book','books','kids','children','–','-','|']);
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[™®©]/g,'').toLowerCase()}
function toks(s){return norm(s).split(/[^a-z0-9]+/).filter(t=>t&&t.length>1&&!STOP.has(t))}
function titleScore(name,entry){
  const lt=toks(name);if(!lt.length)return 0;
  const et=toks(entry.title+' '+entry.short);const set=new Set(et);let hit=0;
  lt.forEach((t,i)=>{ if(set.has(t))hit++; else if(i===lt.length-1&&t.length>=2&&et.some(e=>e.startsWith(t)))hit+=.8; else if(et.some(e=>e.length>4&&(e.startsWith(t)||t.startsWith(e))))hit+=.6;});
  const a=hit/lt.length;
  const tt=[...new Set(toks(entry.title))];const ls=new Set(lt);
  const b=tt.length>=3?tt.filter(t=>ls.has(t)).length/tt.length:0;
  return Math.max(a,b*.95);
}
function skuKey(s){return String(s||'').toUpperCase().replace(/\s+/g,'').replace(/(\.\.\.|…)$/,'*')}
function findBySku(sku){
  const k=skuKey(sku);if(!k)return null;const trunc=k.endsWith('*');const base=k.replace(/\*$/,'');
  for(const e of catalog)for(const s of e.skus){const sk=skuKey(s);
    if(sk===k)return e;
    if(sk.endsWith('*')&&base.startsWith(sk.slice(0,-1)))return e;
    if(trunc&&sk.replace(/\*$/,'').startsWith(base)&&base.length>=6)return e;}
  for(const e of catalog)for(const c of (e.codes||[]))if(String(c).toUpperCase()===k)return e;
  return null;
}
function bestByTitle(name,brandHint){
  let best=null,bs=0,second=0;
  for(const e of catalog){let s=titleScore(name,e);if(brandHint&&e.brand===brandHint)s+=.05;if(s>bs){second=bs;bs=s;best=e}else if(s>second)second=s}
  return {e:best,score:bs,margin:bs-second};
}
function brandFromText(t){for(const k of ['SS','LWM','TD','DS'])if(BRANDS[k].re.test(t||''))return k;return null}

function resolveShip(sh){
  sh.flags=[];const d=sh.data;
  if(!d){sh.kind='review';sh.items=[];sh.brand='X';sh.flags.push({lv:'bad',t:sh.aiError?('AI read nahi kar paya: '+sh.aiError):'Label image hai, text nahi. "AI se padho" dabao.'});return sh}
  const hintBrand=brandFromText(d.shippedBy||'');
  sh.items=(d.items||[]).map(it=>{
    const o={sku:it.sku||'',name:it.name||'',qty:+it.qty||1,amount:+it.amount||0};
    let e=(it.entryId&&catalog.find(c=>c.id===it.entryId))||findBySku(o.sku);
    if(e){o.entry=e;o.how='sku';
      if(o.name){const sc=titleScore(o.name,e);const b=bestByTitle(o.name,hintBrand);
        if(sc<.34&&b.e&&b.e.id!==e.id&&b.score>.6){sh.flags.push({lv:'bad',t:`SKU ${o.sku} = "${e.short}", lekin label par naam "${o.name}" likha hai. Product galat ho sakta hai.`})}}
    }else{
      const b=bestByTitle(o.name,hintBrand);
      if(b.e&&b.score>=.6&&b.margin>=.12){o.entry=b.e;o.how='title';sh.flags.push({lv:'warn',t:`SKU "${o.sku||'—'}" catalog me nahi. Naam se "${b.e.short}" mana. Catalog me SKU jod do.`,fix:{sku:o.sku,id:b.e.id}})}
      else{sh.flags.push({lv:'bad',t:`Product pehchana nahi: ${o.sku||'(no SKU)'} · ${o.name||''}`,unknown:{sku:o.sku,name:o.name}})}
    }
    return o;});
  if(!sh.items.length)sh.flags.push({lv:'bad',t:'Label par koi item nahi mila.'});
  const brands=[...new Set(sh.items.filter(i=>i.entry).map(i=>i.entry.brand))];
  sh.brand=brands[0]||hintBrand||brandFromText(sh.items.map(i=>i.name).join(' '))||'X';
  if(brands.length>1)sh.flags.push({lv:'warn',t:'Ek order me alag-alag brand ke product hain.'});
  if(hintBrand&&brands.length===1&&hintBrand!==brands[0])sh.flags.push({lv:'warn',t:`Label par seller "${d.shippedBy}" hai, product ${BRANDS[brands[0]].name} ka hai.`});
  if(sh.ai&&sh.ai.confidence<.8)sh.flags.push({lv:'warn',t:'AI ne padha, confidence kam hai. Label ek baar dekh lo.'});
  // merge same entry lines
  const lines={};for(const i of sh.items){const k=i.entry?i.entry.id:'?'+skuKey(i.sku);lines[k]=(lines[k]||0)+i.qty}
  const keys=Object.keys(lines).sort();
  sh.totalQty=sh.items.reduce((a,i)=>a+i.qty,0);
  sh.multi=keys.length>1;
  sh.key=keys.map(k=>k+'×'+lines[k]).join('+');
  sh.kind=sh.flags.some(f=>f.lv==='bad')?'review':(sh.multi?'multi':'single');
  return sh;
}
function markDuplicates(){
  const seen=new Map();
  for(const sh of S.ships){sh.dup=null;const d=sh.data;if(!d)continue;
    const k=(d.awb?'A:'+d.awb:'')||(d.orderId?'O:'+d.platform+d.orderId:'');if(!k)continue;
    if(seen.has(k)){sh.dup=seen.get(k);}else seen.set(k,sh);}
  for(const sh of S.ships)if(sh.dup){const o=sh.dup;sh.flags.push({lv:'warn',t:`Duplicate: yeh label "${fileName(o.fileId)}" page ${o.pages[0]+1} me bhi hai.`})}
}
function fileName(id){const f=S.files.find(x=>x.id===id);return f?f.name:'demo'}
function reresolve(){S.ships.forEach(resolveShip);markDuplicates();render()}

/* ---------- loading ---------- */
let uid=0;
async function addFiles(list){
  if(!window.pdfjsLib){toast('PDF reader load nahi hua. Page reload karo.');return}
  if(S.demo){S.demo=false;S.ships=[];S.files=[]}
  for(const file of list){
    if(!/pdf$/i.test(file.name)&&file.type!=='application/pdf')continue;
    const id='f'+(++uid);const bytes=new Uint8Array(await file.arrayBuffer());
    const rec={id,name:file.name,bytes,status:'Padh raha hoon…',size:file.size};S.files.push(rec);S.load={file:file.name,p:0,n:1,fi:list.indexOf(file)+1,fn:list.length};renderFiles();renderHero();
    try{
      const pdf=await pdfjsLib.getDocument({data:bytes.slice(),isEvalSupported:false}).promise;rec.pdf=pdf;rec.pages=pdf.numPages;
      const pages=[];
      for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const vp=pg.getViewport({scale:1});const tc=await pg.getTextContent();
        pages.push({w:vp.width,h:vp.height,items:tc.items.map(i=>({s:i.str,x:i.transform[4],y:vp.height-i.transform[5],w:i.width}))});
        if(p%4===0||p===pdf.numPages){rec.status=`Padh raha hoon… ${p}/${pdf.numPages}`;S.load.p=p;S.load.n=pdf.numPages;renderFiles();renderHero()}}
      rec.sizes=pages.map(p=>[p.w,p.h]);
      const groups=groupPages(pages);
      const aiCache=lsGet('lvd.ai',{});
      for(const g of groups){const sh={id:'s'+(++uid),fileId:id,pages:g.pages,extra:g.extra||[],data:g.data,needsAI:!!g.needsAI};
        const ck=file.name+'|'+file.size+'|'+g.pages[0];sh.ck=ck;
        if(sh.needsAI&&aiCache[ck]){applyAI(sh,aiCache[ck])}
        S.ships.push(sh)}
      const n=groups.length,ai=groups.filter(g=>g.needsAI).length;
      rec.status=`${n} label`+(ai?` · ${ai} image (AI chahiye)`:'');
    }catch(e){rec.status='Ye PDF nahi khula: '+(e.message||e)}
    reresolve();
  }
  S.load=null;reresolve();
}

/* ---------- filters ---------- */
function shipFacet(sh){const d=sh.data||{};return{brand:sh.brand,courier:d.courier||'Unknown',platform:d.platform||(sh.needsAI?'Image label':'Unknown'),pay:d.payment||'—'}}
function passFilters(sh,skip){
  const f=S.f,fc=shipFacet(sh);
  for(const k of ['brand','courier','platform','pay'])if(k!==skip&&f[k].size&&!f[k].has(fc[k]))return false;
  if(f.q&&skip!=='q'){const q=norm(f.q);const d=sh.data||{};
    const hay=norm([d.awb,d.orderId,d.shippedBy,...sh.items.map(i=>i.sku+' '+i.name+' '+(i.entry?i.entry.short:''))].join(' '));
    if(!hay.includes(q))return false}
  return true;
}
const visible=()=>S.ships.filter(sh=>passFilters(sh));

/* ---------- couriers (generic monogram badges) ---------- */
const COURIER_META=[[/ekart|e-kart/i,'EK','--c-ekart'],[/blue\s*dart/i,'BD','--c-bluedart'],[/delhivery/i,'DL','--c-delhivery'],[/xpress\s*bees/i,'XB','--c-xb'],
  [/amazon/i,'AMZ','--c-amz'],[/dtdc/i,'DT','--c-dtdc'],[/shadowfax/i,'SF','--c-sf'],[/ecom/i,'EE','--c-ecom'],[/india\s*post|speed\s*post/i,'IP','--c-ip']];
function cMeta(name){for(const [re,c,v] of COURIER_META)if(re.test(name||''))return{code:c,v};const n=String(name||'?').replace(/[^A-Za-z]/g,'');return{code:(n.slice(0,2)||'?').toUpperCase(),v:'--c-x'}}
function cBadge(name,lg){const m=cMeta(name);return `<span class="cb${lg?' lg':''}" style="--c:var(${m.v})" aria-hidden="true">${m.code}</span>`}
function cPill(name,k){return `<span class="cpill">${cBadge(name)}${esc(name)}${k!=null?` <span class="k">${k}</span>`:''}</span>`}

function botState(){
  const c=counts();const need=S.ships.filter(s=>s.needsAI&&!s.data).length;
  if(S.load){const L=S.load;return{mode:'busy',h:`Label scan ho rahe hain…`,say:`File ${L.fi}/${L.fn}: <b>${esc(L.file)}</b> — page ${L.p}/${L.n}`,prog:L.n?L.p/L.n:0}}
  if(S.ai.running)return{mode:'busy',h:'AI image label padh raha hai',say:`${S.ai.done}/${S.ai.total} label padhe. Har label se product, SKU, qty aur AWB nikal raha hoon.`,prog:S.ai.total?S.ai.done/S.ai.total:0}
  if(!S.ships.length)return{mode:'idle',h:'Namaste! Labels daalo, main check karta hoon.',say:'Main har label ka SKU aur product naam aapke 4 brands ke catalog se milata hoon, galat ya shak wale label laal kar deta hoon, aur product-wise PDF bana deta hoon.'}
  const top=groupsOf('single')[0];const ins=[];
  ins.push({t:`${c.all} label check kiye`});
  if(c.review)ins.push({t:`${c.review} me problem`,c:'bad'});else ins.push({t:'Koi problem nahi',c:'ok'});
  if(c.dup)ins.push({t:`${c.dup} duplicate alag kiye`});

  const cod=visible().reduce((a,s)=>a+((s.data&&s.data.payment==='COD'&&s.data.cod)||0),0);if(cod)ins.push({t:`COD ₹${cod.toLocaleString('en-IN')}`});
  if(need)return{mode:'alert',h:`${need} label sirf image hain`,say:'Inme text nahi hai (jaise Amazon Shipping label). <b>AI se padho</b> dabao, main inhe bhi padh kar verify kar dunga. Label image aapke Claude account se Claude ko jayegi.',ins}
  if(c.review)return{mode:'alert',h:`${c.review} label pack mat karo — pehle check karo`,say:'Laal labels me SKU/naam match nahi hua ya product catalog me nahi hai. <b>Check karo</b> tab me reason aur fix dono hai.',ins}
  return{mode:'ok',h:'Sab label sahi hain. Pack karne ke liye ready!',say:'Product-wise PDF download karo. Har product ke pehle aur aakhri page par product aur courier ki details hongi.',ins}
}

function bindDrop(){const drop=$('#drop');if(!drop)return;
  ['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
  ['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
  drop.addEventListener('drop',e=>{e.stopPropagation();addFiles([...e.dataTransfer.files])});}

  el.innerHTML=all.length?all.map(v=>{const lbl=key==='brand'?BRANDS[v].name:v;

let io=null;
function hydrateThumbs(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);loadThumb(e.target)}}),{rootMargin:'200px'});
  document.querySelectorAll('img[data-th]').forEach(im=>io.observe(im));
}
async function pageImage(fileId,page,scale,type){
  const f=S.files.find(x=>x.id===fileId);if(!f||!f.pdf)return null;
  const pg=await f.pdf.getPage(page+1);const vp=pg.getViewport({scale});
  const c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext:ctx,viewport:vp}).promise;
  if(type==='blob')return await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
  return c.toDataURL('image/jpeg',.8);
}
async function loadThumb(img){
  const k=img.dataset.th;const done=u=>{img.src=u;img.nextElementSibling&&img.nextElementSibling.remove()};
  if(S.thumbs.has(k)){done(S.thumbs.get(k));return}
  const [fid,p]=k.split(':');try{const f=S.files.find(x=>x.id===fid);const w=(f.sizes&&f.sizes[+p][0])||288;const url=await pageImage(fid,+p,Math.min(1,220/w),'url');
    if(url){S.thumbs.set(k,url);done(url)}}catch(e){}
}

let downloadsNS=null;
const pdfLibCache=new Map();
function ascii(s){return norm(s).replace(/[–—]/g,'-').replace(/[^\x20-\x7e]/g,'').replace(/\s+/g,' ').trim()}
function ascii2(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[–—]/g,'-').replace(/×/g,'x').replace(/₹/g,'Rs ').replace(/[™®©]/g,'').replace(/[^\x20-\x7e]/g,'').trim()}
function comboTitle(sh){const lines={};sh.items.forEach(i=>{const k=itemLabel(i);lines[k]=(lines[k]||0)+i.qty});return Object.entries(lines).map(([k,q])=>`${q}x ${k}`).join(' + ')}
/* split: product | courier | brand → [{title,kind,brand,ships}] */
function buildGroups(list,split){
  const m=new Map();
  for(const sh of list){if(S.opt.skipDup&&sh.dup)continue;if(!sh.pages)continue;
    const d=sh.data||{};let k,title;
    if(split==='courier'){k=d.courier||'Unknown courier';title=k}
    else if(split==='brand'){k=sh.brand;title=BRANDS[sh.brand].name}
    else{ if(sh.kind==='review'&&!sh.items.length){k='review|unread';title='Check karo - label padha nahi gaya'}
          else{k=sh.kind+'|'+sh.key;title=(sh.kind==='review'?'CHECK: ':'')+(sh.items.length?comboTitle(sh):'Unknown')}}
    if(!m.has(k))m.set(k,{key:k,title,split,ships:[]});m.get(k).ships.push(sh)}
  const rank={single:0,multi:1,review:2};
  const gs=[...m.values()];
  for(const g of gs){g.kind=g.ships[0].kind;g.brand=g.ships[0].brand;
    g.ships.sort((a,b)=>split==='product'?String((a.data||{}).courier).localeCompare(String((b.data||{}).courier)):(rank[a.kind]-rank[b.kind]||a.key.localeCompare(b.key)||String((a.data||{}).courier).localeCompare(String((b.data||{}).courier))))}
  gs.sort((a,b)=>split==='product'?(rank[a.kind]-rank[b.kind]||a.brand.localeCompare(b.brand)||b.ships.length-a.ships.length):b.ships.length-a.ships.length);
  return gs;
}
function groupFacts(g){
  const cs={},ps={},bs={},prod={};let pcs=0,cod=0,codN=0;
  for(const s of g.ships){const d=s.data||{};cs[d.courier||'?']=(cs[d.courier||'?']||0)+1;ps[d.platform||'?']=(ps[d.platform||'?']||0)+1;bs[BRANDS[s.brand].name]=(bs[BRANDS[s.brand].name]||0)+1;pcs+=s.totalQty||0;
    if(d.payment==='COD'){codN++;cod+=d.cod||0}for(const i of s.items){const k=itemLabel(i);prod[k]=(prod[k]||0)+i.qty}}
  const ent=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
  return{cs:ent(cs),ps:ent(ps),bs:ent(bs),prod:ent(prod),pcs,cod,codN,skus:[...new Set(g.ships.flatMap(s=>s.items.map(i=>i.sku)).filter(Boolean))]};
}
function drawInfoPage(out,fonts,W,H,g,which,idx,total,next){
  const {rgb}=PDFLib;const {bold,reg,mono}=fonts;const p=out.addPage([W,H]);
  const s=Math.min(W/288,H/432);const m=16*s;let y=H;const maxW=W-2*m;const ink=rgb(0,0,0),grey=rgb(.38,.38,.38);
  const put=(t,size,font,col,x)=>{y-=size;p.drawText(t,{x:x??m,y,size,font,color:col||ink});y-=size*.3};
  const para=(t,size,font,col,maxLines)=>{const words=ascii2(t).split(' ');let cur='',n=0;
    for(const w of words){const tr=cur?cur+' '+w:w;if(font.widthOfTextAtSize(tr,size)>maxW&&cur){if(maxLines&&n>=maxLines-1){put(cur+' ...',size,font,col);return}put(cur,size,font,col);n++;cur=w}else cur=tr}
    if(cur)put(cur,size,font,col)};
  const isStart=which==='START';const f=groupFacts(g);
  // band
  const bandH=30*s;p.drawRectangle({x:0,y:H-bandH,width:W,height:bandH,color:ink});
  p.drawText(isStart?'START':'END',{x:m,y:H-bandH+9*s,size:15*s,font:bold,color:rgb(1,1,1)});
  const bt=`BATCH ${idx+1} / ${total}`;p.drawText(bt,{x:W-m-mono.widthOfTextAtSize(bt,9*s),y:H-bandH+11*s,size:9*s,font:mono,color:rgb(1,1,1)});
  y=H-bandH-10*s;
  const kindTxt=g.split==='courier'?'COURIER BATCH':g.split==='brand'?'BRAND BATCH':g.kind==='multi'?'MULTI-ITEM ORDER':g.kind==='review'?'CHECK KARO - REVIEW':'SINGLE PRODUCT';
  put(kindTxt+'  |  '+f.bs.map(b=>b[0].toUpperCase()).join(', '),8*s,bold,grey);y-=2*s;
  para(g.title,(ascii2(g.title).length>40?15:19)*s,bold,ink,4);
  if(g.split!=='product'&&f.prod.length){y-=2*s;f.prod.slice(0,5).forEach(([k,q])=>para(`${q} pcs  ${k}`,9*s,reg,ink,1));if(f.prod.length>5)put(`+${f.prod.length-5} aur product`,8*s,reg,grey)}
  if(f.skus.length&&g.split==='product'){y-=1*s;para('SKU: '+f.skus.join(', '),8*s,mono,grey,2)}
  y-=6*s;
  // big count
  const cnt=String(g.ships.length);put(cnt,54*s,bold);
  y+=4*s;put(`label${g.ships.length>1?'s':''}  ·  ${f.pcs} pcs`+(f.codN?`  ·  COD ${f.codN}`:''),10*s,reg);
  y-=6*s;p.drawLine({start:{x:m,y},end:{x:W-m,y},thickness:.8*s,color:grey});y-=4*s;
  put('COURIER',7.5*s,bold,grey);
  for(const [c,k] of f.cs.slice(0,6)){put(`${ascii2(c)}  -  ${k} label${k>1?'s':''}`,11*s,bold)}
  put('PLATFORM: '+f.ps.map(([pf,k])=>`${ascii2(pf)} ${k}`).join(', '),7.5*s,reg,grey);
  y-=4*s;
  if(isStart){
    para(`Pehla label agle page par hai. Is batch me ${g.ships.length} label hain, sab ${g.split==='courier'?'is courier':'is product'} ke.`,8.5*s,reg,ink,3);
  }else{
    para(`Yeh is batch ka AAKHRI label tha. ${g.ships.length} label gin lo.`,8.5*s,bold,ink,2);
    if(next){y-=2*s;para('Agla batch: '+next,8*s,reg,grey,2)}
    // AWB checklist
    const awbs=g.ships.map(s=>packKey(s));const fs=6.5*s;const lh=fs*1.45;const colW=(W-2*m)/2;const room=Math.floor((y-m-10*s)/lh)*2;
    if(room>=2){y-=4*s;put('AWB CHECKLIST',7*s,bold,grey);const top=y;const show=awbs.slice(0,Math.max(0,room-(awbs.length>room?1:0)));
      show.forEach((a,i)=>{const col=i%2,row=Math.floor(i/2);const yy=top-(row+1)*lh;const x=m+col*colW;
        p.drawRectangle({x,y:yy-.5*s,width:fs*.9,height:fs*.9,borderColor:grey,borderWidth:.6*s});
        p.drawText(ascii2(a).slice(0,26),{x:x+fs*1.4,y:yy,size:fs,font:mono,color:ink})});
      if(awbs.length>show.length){const yy=top-(Math.ceil(show.length/2)+1)*lh;p.drawText(`+${awbs.length-show.length} aur`,{x:m,y:yy,size:fs,font:reg,color:grey})}}
  }
  p.drawText(ascii2(`Label Verify Desk  ·  ${new Date().toLocaleString('en-IN')}`),{x:m,y:6*s,size:5.5*s,font:reg,color:grey});
}
async function buildPdf(groups){
  const {PDFDocument,StandardFonts}=PDFLib;const out=await PDFDocument.create();
  const fonts={bold:await out.embedFont(StandardFonts.HelveticaBold),reg:await out.embedFont(StandardFonts.Helvetica),mono:await out.embedFont(StandardFonts.Courier)};
  let n=0;
  for(let gi=0;gi<groups.length;gi++){const g=groups[gi];
    const sh0=g.ships[0];const f0=S.files.find(f=>f.id===sh0.fileId);let [W,H]=(f0&&f0.sizes&&f0.sizes[sh0.pages[0]])||[288,432];
    if(S.opt.separators)drawInfoPage(out,fonts,W,H,g,'START',gi,groups.length);
    for(const sh of g.ships){
      const f=S.files.find(x=>x.id===sh.fileId);if(!f)continue;
      let src=pdfLibCache.get(f.id);if(!src){src=await PDFDocument.load(f.bytes,{ignoreEncryption:true});pdfLibCache.set(f.id,src)}
      const idx=sh.pages.concat(S.opt.invoice?sh.extra:[]).sort((a,b)=>a-b);
      const copied=await out.copyPages(src,idx);copied.forEach(p=>out.addPage(p));n++;
    }

async function runAI(){
  const sample=await getSample();

  let lim=null;try{lim=await sample.limits()}catch(e){}
  if(!lim||!lim.images){S.ai.msg='Is view se image AI ko nahi bhej sakte.';renderAI();return}
  const per=Math.max(1,Math.min(4,lim.images.maxCount||1));
  const todo=S.ships.filter(s=>s.needsAI&&!s.data);
  const ctl=new AbortController();S.ai={running:true,done:0,total:todo.length,ctl,msg:''};renderAI();
  const skuList=catalog.map(e=>`${e.skus.join('/')||'(no sku)'} = ${e.short} [${BRANDS[e.brand].name}]`).join('\n');
  const cache=lsGet('lvd.ai',{});
  for(let i=0;i<todo.length&&!ctl.signal.aborted;i+=per){
    const batch=todo.slice(i,i+per);
    try{
      const imgs=[];for(const sh of batch){const f=S.files.find(x=>x.id===sh.fileId);const w=(f.sizes&&f.sizes[sh.pages[0]][0])||288;imgs.push(await pageImage(sh.fileId,sh.pages[0],Math.min(3,820/w),'blob'))}
      const prompt=`You are reading ${batch.length} Indian e-commerce shipping label image(s), in order. For EACH image return one object, in the same order, in a JSON array. No other text.
Object shape: {"awb": string, "orderId": string (invoice id / order id, keep any # sign), "courier": string (e.g. "Amazon Shipping","Delhivery","Ekart","BlueDart"), "platform": string (who generated label, e.g. "Amazon Shipping","Shiprocket","RapidShyp"), "payment": "COD"|"Prepaid"|"", "seller": string (the "Ordered From"/"Shipped By"/seller name), "items": [{"sku": string, "name": string, "qty": number}], "confidence": number 0-1}.
Rules: SKU is usually the code in brackets before the item title, e.g. "(NEW-GITA) Bhagavad Gita..." -> sku "NEW-GITA". Copy SKU exactly as printed. qty defaults to 1 if not printed. If text is unreadable, give empty items and low confidence. Never invent items.
Known catalog SKUs for reference (only to help you read; still copy what is printed):
${skuList}`;
      const res=await sample.json(prompt,{images:imgs,signal:ctl.signal,modelTier:'default'});
      const arr=Array.isArray(res)?res:(res&&Array.isArray(res.labels)?res.labels:[res]);
      batch.forEach((sh,k)=>{const r=arr[k];if(r){applyAI(sh,r);if(sh.data){cache[sh.ck]=r}}else{sh.aiError='jawab nahi aaya'}});
      lsSet('lvd.ai',cache);
    }catch(e){
      if(e&&e.code==='cancelled')break;
      if(['not_granted','sampling_disabled','images_unavailable','capability_disabled','not_declared'].includes(e&&e.code)){S.ai.msg='AI ki permission nahi mili. Label par "Haath se item likho" use karo.';break}
      if(e&&e.code==='rate_limited'){S.ai.msg='AI limit aa gayi. Thodi der baad dobara dabao.';break}
      batch.forEach(sh=>sh.aiError=(e&&e.code)||'error');
    }
    S.ai.done=Math.min(todo.length,i+batch.length);reresolve();
  }
  const left=S.ships.filter(s=>s.needsAI&&!s.data).length;
  S.ai.running=false;if(!S.ai.msg)S.ai.msg=left?`${left} label AI nahi padh paya. "Check karo" tab me dekho.`:'Sab image label padh liye. "Check karo" tab ek baar dekh lo.';reresolve();
}

  if(t.hasAttribute('data-close')||t.id==='dw'){$('#drawer').innerHTML='';return}

  if(t.dataset.dl){const kind=t.dataset.dl;downloadShips(listFor(kind),{all:'filtered-labels',single:'single-product',multi:'multi-item',review:'check-karo'}[kind],kind==='review'?'product':undefined);return}

  if(t.dataset.dlw){downloadShips(visible().filter(s=>s.kind!=='review'&&s.flags.some(f=>f.lv==='warn')),'warning-labels','product');return}
  if(t.dataset.one){const sh=S.ships.find(s=>s.id===t.dataset.one);if(sh){const dup=S.opt.skipDup;S.opt.skipDup=false;downloadShips([sh],'label-'+packKey(sh),'product').finally(()=>{S.opt.skipDup=dup})}return}
  if(t.dataset.dlg){const ships=visible().filter(s=>s.kind===t.dataset.kind&&s.key===t.dataset.dlg);downloadShips(ships,itemLabel(ships[0].items[0])+(t.dataset.kind==='single'?'-x'+ships[0].totalQty:'-combo'),'product');return}

    case 'aiDismiss':S.ai.msg='';renderAI();break;
    case 'pickCsv':pickCsv();break;
    case 'catAdd':catalog.push({id:'c'+Date.now(),brand:'SS',short:'Naya product',title:'',skus:[],codes:[]});saveCatalog();renderView();break;
    case 'catReset':catalog=JSON.parse(JSON.stringify(SEED));saveCatalog();reresolve();break;
    case 'catAiFix':case 'catAiFix2':aiFixUnknown();break;
    case 'scanReset':scan={...scan,sh:null,got:{},last:'',lastMsg:''};renderView();break;
    case 'scanManual':if(scan.sh){S.packed[packKey(scan.sh)]=Date.now();lsSet('lvd.packed',S.packed);logScan(true,packKey(scan.sh)+' · haath se OK');scan={...scan,sh:null,got:{},last:'',lastMsg:''};renderStats();renderView()}break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='optInv'){S.opt.invoice=t.checked}
  if(t.id==='optSep'){S.opt.separators=t.checked}
  if(t.id==='optDup'){S.opt.skipDup=t.checked;softRender()}
  if(t.dataset.ci!=null){const e2=catalog[+t.dataset.ci];const k=t.dataset.k;
    if(k==='skus'||k==='codes')e2[k]=t.value.split(',').map(s=>s.trim()).filter(Boolean);else e2[k]=t.value;
    if(k==='short'&&!e2.title)e2.title=t.value;saveCatalog();S.ships.forEach(resolveShip);markDuplicates();renderHero();renderStats();renderTabs();renderFilters()}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='scanIn'&&e.key==='Enter'){e.preventDefault();const v=e.target.value;e.target.value='';doScan(v);setTimeout(()=>$('#scanIn')&&$('#scanIn').focus(),10)}
  if(e.key==='Escape'&&$('#dw'))$('#drawer').innerHTML='';
});
function manualEntry(id){
  const sh=S.ships.find(s=>s.id===id);if(!sh)return;
  $('#drawer').innerHTML=`<div class="drawer" id="dw"><div class="in"><div style="display:flex;gap:10px;align-items:center"><h3 style="flex:1">Label ka item haath se likho</h3><button class="btn sm" type="button" data-close>Band karo</button></div>
   <p class="note">Label image dekh kar product chuno. AWB scan-verify ke liye zaroori hai.</p>
   <label class="note" for="mAwb">AWB</label><input class="search mono" id="mAwb">
   <label class="note" for="mProd">Product</label><select class="search" id="mProd">${catalog.map(e=>`<option value="${e.id}">${esc(BRANDS[e.brand].name)} · ${esc(e.short)}</option>`).join('')}</select>
   <label class="note" for="mQty">Qty</label><input class="search mono" id="mQty" type="number" min="1" value="1">
   <div><button class="btn primary" type="button" id="mSave">Save</button></div><div class="pages" id="dwPages"><span class="note">Label load ho raha hai…</span></div></div></div>`;
  $('#mSave').onclick=()=>{const e=catalog.find(c=>c.id===$('#mProd').value);
    applyAI(sh,{awb:$('#mAwb').value,courier:'Amazon Shipping',platform:'Image label (manual)',items:[{sku:(e.skus[0]||'').replace(/\*$/,''),entryId:e.id,name:e.short,qty:+$('#mQty').value||1}],confidence:1});
    $('#drawer').innerHTML='';reresolve();toast('Save ho gaya');};
  pageImage(sh.fileId,sh.pages[0],1.4,'url').then(u=>{const b=$('#dwPages');if(b&&u)b.innerHTML=`<img alt="Label" src="${u}">`}).catch(()=>{});
}
render();

</script>

</body></html>
